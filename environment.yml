  - nodefaults
dependencies:
  - python=3.9.20
  - pip=24.2
  - setuptools=75.1.0
  - wheel=0.44.0
  - numpy=2.0.2
  - pandas=2.2.3
  - scipy=1.13.1
  - scikit-learn=1.5.2
  - joblib=1.4.2
